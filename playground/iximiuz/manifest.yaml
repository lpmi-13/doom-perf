kind: playground
name: doom-perf-c0bd32e1
base: flexbox
title: Doom Perf Lab
description: Explore host CPU telemetry as an interactive Doom diagnostics lab with use-tool and use-practice preinstalled.
categories:
  - linux
  - observability
playground:
  networks:
    - name: local
      subnet: 172.16.0.0/24
  machines:
    - name: lab-01
      users:
        - name: root
        - name: laborant
          default: true
          welcome: |
            Doom Perf is served from this VM.

            Open the "Doom Perf" tab, then click "Open Game" to launch it
            in a separate browser tab with direct keyboard input.

            Generate real host load to watch in the game's live-stats mode:
              use-practice run          # pick a resource + profile
              use-practice run cpu      # or target cpu|memory|disk|network
              use-practice status       # active run + PIDs
              use-practice reveal       # show the answer
              use-practice stop         # end the run

            The scenarios intentionally stress CPU, memory, disk, or network;
            this VM is disposable. CPU/memory/disk load appears in the game
            immediately; network runs in a namespace, so verify it live.

            You can also run checks via use-tool:
              use-tool practice system

      drives:
        - source: oci://ghcr.io/lpmi-13/doom-perf-rootfs:v14
          mount: /
          size: 20GiB
      network:
        interfaces:
          - address: 172.16.0.2/24
            network: local
      resources:
        cpuCount: 4
        ramSize: 8GiB
  tabs:
    - id: terminal-lab-01
      kind: terminal
      name: lab-01
      machine: lab-01
    - id: doom-perf
      kind: http-port
      name: Doom Perf
      machine: lab-01
      number: 8080
      access: public
  initTasks:
    init_lab_01_1:
      name: init_lab_01_1
      machine: lab-01
      init: true
      user: root
      timeout_seconds: 300
      run: |-
        #!/bin/bash
        set -euo pipefail

        install_use_tool_latest() {
          local release_repo tag version arch asset base_url tmp

          release_repo="lpmi-13/use-tool"

          case "$(uname -m)" in
            amd64|x86_64) arch="amd64" ;;
            arm64|aarch64) arch="arm64" ;;
            *) echo "unsupported use-tool release architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          tag="$(curl -fsSL "https://api.github.com/repos/${release_repo}/releases/latest" | jq -r '.tag_name // empty')"
          [[ -n "${tag}" ]] || { echo "could not resolve latest use-tool release tag" >&2; exit 1; }

          version="${tag#v}"
          asset="use-tool_${version}_linux_${arch}.tar.gz"
          base_url="https://github.com/${release_repo}/releases/download/${tag}"
          tmp="$(mktemp -d /tmp/use-tool-release.XXXXXX)"
          trap 'rm -rf "${tmp}"' RETURN

          curl -fsSL -o "${tmp}/${asset}" "${base_url}/${asset}"
          curl -fsSL -o "${tmp}/checksums.txt" "${base_url}/checksums.txt"
          (cd "${tmp}" && grep -F "  ${asset}" checksums.txt | sha256sum -c -)
          tar -xzf "${tmp}/${asset}" -C "${tmp}" use-tool
          install -m 0755 "${tmp}/use-tool" /usr/local/bin/use-tool
        }

        install_use_tool_latest
        /opt/iximiuz-labs/wait-doom-perf-ready.sh
  accessControl:
    canList:
      - anyone
    canRead:
      - anyone
    canStart:
      - anyone
