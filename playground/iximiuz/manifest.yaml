kind: playground
name: doom-perf-c0bd32e1
base: flexbox
title: Doom Perf Lab
description: Explore live host CPU/Memory/Disk/Network telemetry as an interactive Doom diagnostics lab. All the elements in the game react to system signals (eg, the cpu cores glow red when there's high utilization).
cover: /content/files/playgrounds/doom-perf-c0bd32e1/__static__/title-screen.png?v=1789051139671
categories:
    - linux
    - observability
markdown: |-
    Brendan Gregg's USE Methodology is a super cool way to explore potential bottlenecks in different linux system components (CPU/Memory/Disk/Network), but a lot of the ways you'll see people demonstrating it are via a terminal.

    This is a way to see the different system telemetry signals in a Doom environment. Based on the very cool https://github.com/pascalvanderheiden/doom-typescript.

    ::highlight
    The elements in each of the wings actually respond to live system telemetry (in live stats mode), so cpu cores glow red, disk IO orbs fly around faster, and memory pages fly in and out of the physical RAM.
    ::

    Play one of the sim modes to see what utilization/saturation looks like, or combine live stats mode with the `use-practice` tool bundled in the playground to generate real load on the VM.

    ## How to play

    ```
    Open the "Doom Perf" tab, then click "Open Game" to launch it
    in a separate browser tab with direct keyboard input.

    Generate real host load to watch in the game's live-stats mode:
      use-practice run          # pick a resource + profile
      use-practice run cpu      # or target cpu|memory|disk|network
      use-practice status       # active run + PIDs
      use-practice reveal       # show the answer
      use-practice stop         # end the run

    The scenarios intentionally stress CPU, memory, disk, or network;
    this VM is disposable. CPU/memory/disk load appears in the game
    immediately; network runs in a namespace, so verify it live.
    ```

    You can wander freely, checking out the different visual elements of each wing, and there are also various wall terminals spaced around each wing so that you can see something closer to the output of real Linux commands.

    ::slide-show
    ---
    slides:
    - image: __static__/cpu-cores.png
      alt: "cpu cores glowing along with the amount of utilization"
      description: "The CPU cores in the CPU wing will show the number of logical CPUs as well as the current utilization (color) and saturation (speed of motion) of the live VM."
    - image: __static__/run-queue.png
      alt: "run queue showing threads waiting for on-cpu time and blocked threads"
      description: "The run queue shows both threads that are waiting for time on-cpu as well as threads in D state blocked on IO from the live VM system."
    - image: __static__/disk-spire.png
      alt: "disk element showing amount of disk utilization and IO requests"
      description: "The central Disk wing element shows the utilization of the main disk in the live VM"
    - image: __static__/major-minor-faults.png
      alt: "the minor and major page faults as memory gets moved in and out of physical RAM"
      description: "The minor and major page faults as pages get moved in and out of physical RAM on the live VM"
    - image: __static__/network-ethernet-tunnel.png
      alt: "network wing showing representative packet traffic"
      description: "The network wing shows a downsampled representation of live network traffic from the VM"
    ---
    ::

    It's also got the [use-practice](https://github.com/lpmi-13/use-practice) and [use-tool](https://github.com/lpmi-13/use-tool) tools installed, so you can put real stress on the system to visualize in the Doom world. You can even run a random load and see if you can find it in the environment.

    And if you're really curious, you might even find the easter egg hidden in there somewhere...

    The source code is available at https://github.com/lpmi-13/doom-perf
playground:
    networks:
        - name: local
          subnet: 172.16.0.0/24
    machines:
        - name: lab-01
          users:
            - name: root
            - name: laborant
              default: true
              welcome: |
                Doom Perf is served from this VM.

                Open the "Doom Perf" tab, then click "Open Game" to launch it
                in a separate browser tab with direct keyboard input.

                Generate real host load to watch in the game's live-stats mode:
                  use-practice run          # pick a resource + profile
                  use-practice run cpu      # or target cpu|memory|disk|network
                  use-practice status       # active run + PIDs
                  use-practice reveal       # show the answer
                  use-practice stop         # end the run

                The scenarios intentionally stress CPU, memory, disk, or network;
                this VM is disposable. CPU/memory/disk load appears in the game
                immediately; network runs in a namespace, so verify it live.

                You can also run checks via use-tool:
                  use-tool practice system
          drives:
            - source: oci://ghcr.io/lpmi-13/doom-perf-rootfs:v16
              mount: /
              size: 20GiB
          network:
            interfaces:
                - address: 172.16.0.2/24
                  network: local
          resources:
            cpuCount: 4
            ramSize: 8GiB
    tabs:
        - id: terminal-lab-01
          kind: terminal
          name: lab-01
          machine: lab-01
        - id: doom-perf
          kind: http-port
          name: Doom Perf
          machine: lab-01
          number: 8080
          access: public
    initTasks:
        init_lab_01_1:
            name: init_lab_01_1
            machine: lab-01
            init: true
            user: root
            timeout_seconds: 300
            run: |-
                #!/bin/bash
                set -euo pipefail

                install_use_tool_latest() {
                  local release_repo tag version arch asset base_url tmp

                  release_repo="lpmi-13/use-tool"

                  case "$(uname -m)" in
                    amd64|x86_64) arch="amd64" ;;
                    arm64|aarch64) arch="arm64" ;;
                    *) echo "unsupported use-tool release architecture: $(uname -m)" >&2; exit 1 ;;
                  esac

                  tag="$(curl -fsSL "https://api.github.com/repos/${release_repo}/releases/latest" | jq -r '.tag_name // empty')"
                  [[ -n "${tag}" ]] || { echo "could not resolve latest use-tool release tag" >&2; exit 1; }

                  version="${tag#v}"
                  asset="use-tool_${version}_linux_${arch}.tar.gz"
                  base_url="https://github.com/${release_repo}/releases/download/${tag}"
                  tmp="$(mktemp -d /tmp/use-tool-release.XXXXXX)"
                  trap 'rm -rf "${tmp}"' RETURN

                  curl -fsSL -o "${tmp}/${asset}" "${base_url}/${asset}"
                  curl -fsSL -o "${tmp}/checksums.txt" "${base_url}/checksums.txt"
                  (cd "${tmp}" && grep -F "  ${asset}" checksums.txt | sha256sum -c -)
                  tar -xzf "${tmp}/${asset}" -C "${tmp}" use-tool
                  install -m 0755 "${tmp}/use-tool" /usr/local/bin/use-tool
                }

                install_use_tool_latest
                /opt/iximiuz-labs/wait-doom-perf-ready.sh
    accessControl:
        canList:
            - anyone
        canRead:
            - anyone
        canStart:
            - anyone
